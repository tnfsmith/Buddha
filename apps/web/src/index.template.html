<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vân Đạo — Tịnh Cảnh tu tập</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='h' cx='.5' cy='.42' r='.6'%3E%3Cstop offset='0' stop-color='%23fff6d2'/%3E%3Cstop offset='.6' stop-color='%23f6c35a'/%3E%3Cstop offset='1' stop-color='%23e08a2a'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='28' r='27' fill='url(%23h)'/%3E%3Cg fill='%238a4f12'%3E%3Ccircle cx='32' cy='9.6' r='3.1'/%3E%3Cellipse cx='32' cy='18.5' rx='6.6' ry='7.4'/%3E%3Cpath d='M21.5 29.5c1.4-3 5.6-4.4 10.5-4.4s9.1 1.4 10.5 4.4l2.6 13.5H18.9z'/%3E%3Cpath d='M12 47c4-5 12-6.5 20-6.5S48 42 52 47c-3 4-11 6-20 6s-17-2-20-6z'/%3E%3C/g%3E%3Cpath d='M10 55c6-4 14-5 22-5s16 1 22 5c-5 3-13 4.6-22 4.6S15 58 10 55z' fill='%23d9a441'/%3E%3C/svg%3E">
<style>
:root{--ink:#2b2936;--soft:#5d5a6b;--gold:#a9792c;--gold2:#d9b36a;--jade:#4d9c8f;--indigo:#6672b8;--glass:rgba(255,251,243,.46);--glass2:rgba(255,251,243,.66);--line:rgba(169,121,44,.26);--serif:"Noto Serif","Times New Roman",Cambria,serif;--sans:"Be Vietnam Pro","Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
/*__FONTS__*/
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6efe2;color:var(--ink);font:14px/1.5 var(--sans)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity .6s}
#ui>*{pointer-events:auto}
body.quiet #top,body.quiet #panel,body.quiet #labels,body.quiet #hud{opacity:0;pointer-events:none}
body.quiet #bar{opacity:.0;pointer-events:none}
#top,#panel,#labels,#hud,#bar{transition:opacity .7s}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(80,60,20,.10)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:12px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{padding:7px 14px;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.brand small{display:block;font:11px/1.2 var(--sans);color:var(--soft);letter-spacing:.02em}
#tabs{margin:0 auto;display:flex;padding:4px;gap:2px}
#tabs button{border:0;background:transparent;padding:7px 16px;border-radius:10px;font-family:var(--serif);font-size:17px;color:var(--soft)}
#tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(80,60,20,.14)}
.ghost{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--soft)}
#labels{position:absolute;inset:0;pointer-events:none}
.zl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;transition:opacity .35s;will-change:left,top;border:1px solid var(--line);background:rgba(255,252,246,.86);border-radius:999px;padding:3px 11px 4px;font-family:var(--serif);font-size:15px;white-space:nowrap;box-shadow:0 2px 10px rgba(80,60,20,.12)}
.zl:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--gold2)}
.zl.lock{color:#8b8796;background:rgba(255,252,246,.6)}
.zl.on{background:#fff;border-color:var(--gold)}
.zl small{font:10.5px var(--sans);color:var(--soft);margin-left:5px}
#panel{position:absolute;right:14px;top:70px;bottom:118px;width:340px;max-width:calc(100vw - 28px);padding:16px 16px 12px;overflow:auto}
#panel h2{font-size:23px;line-height:1.15}
#panel h3{font-size:17px;margin-top:14px}
#panel p{margin:6px 0}
.pali{font-style:italic;color:var(--soft);font-size:12.5px}
.muted{color:var(--soft);font-size:12.5px}
.note{font-size:12px;color:#7a5a1f;background:rgba(217,179,106,.18);border-radius:8px;padding:6px 9px;margin-top:8px}
.accode{font:700 21px/1.35 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.05em;word-break:break-all;margin:10px 0;color:var(--ink);-webkit-user-select:all;user-select:all}
.qr{display:block;border-radius:8px;margin:8px 0}
.btn{border:1px solid var(--gold);background:var(--gold);color:#fff;border-radius:10px;padding:7px 14px;font-weight:600}
.btn.alt{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bars{display:grid;gap:7px;margin-top:10px}
.bar3{display:grid;grid-template-columns:52px 1fr 54px;gap:8px;align-items:center;font-size:12.5px}
.bar3 i{display:block;height:7px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden}
.bar3 i b{display:block;height:100%;border-radius:9px}
.task{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-top:9px;background:rgba(255,255,255,.55)}
.task.done{background:rgba(255,255,255,.3)}
.task .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.task h4{margin:1px 0 3px;font:600 16.5px var(--serif)}
.task p{margin:0;font-size:13px;color:#3d3a48}
.task details{margin-top:8px}
.task summary{cursor:pointer;font-size:12.5px;color:var(--soft)}
.sl{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin-top:5px}
input[type=range]{width:100%;accent-color:var(--gold)}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin-top:6px}
textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:13px var(--sans);background:rgba(255,255,255,.7);resize:vertical;margin-top:6px}
.tier{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px;background:rgba(255,255,255,.5);cursor:pointer;display:block;width:100%;text-align:left}
.tier.on{border-color:var(--gold);background:#fff}
.tier b{font:600 16.5px var(--serif)}
.tier div{font-size:12.5px;color:#3d3a48;margin-top:3px}
.stg{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:7px 8px;border-radius:10px;border:0;background:transparent;width:100%;text-align:left}
.stg.on{background:#fff;box-shadow:0 1px 5px rgba(80,60,20,.12)}
.stg span{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--soft);padding-top:2px}
.stg b{font:600 15.5px var(--serif);display:block}
.stg em{font-size:12px;color:var(--soft);font-style:normal}
#hud{position:absolute;left:14px;top:70px;width:214px;padding:12px;display:none}
body.hall #hud{display:block}
#hud h3{font-size:15px;margin-bottom:6px}
#radar{width:190px;height:190px;display:block}
#scope{width:190px;height:38px;display:block;margin-top:8px;border-radius:8px;background:rgba(43,41,54,.06)}
#hudtxt{font-size:12px;color:var(--soft);margin-top:6px;min-height:34px}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(980px,calc(100vw - 28px));padding:10px 14px 9px}
.trow{display:flex;align-items:center;gap:12px}
#play{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:17px;flex:none;display:grid;place-items:center;box-shadow:0 3px 12px rgba(169,121,44,.4)}
#time{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--soft);min-width:98px;text-align:center}
#track{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none}
#track .rail{position:absolute;left:0;right:0;top:11px;height:5px;border-radius:5px;background:rgba(43,41,54,.12);overflow:hidden}
#track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold2),var(--gold))}
#track .tick{position:absolute;top:7px;width:1px;height:13px;background:rgba(43,41,54,.35)}
#track .thumb{position:absolute;top:6px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#fff;border:2px solid var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.brow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
#stage{font-family:var(--serif);font-size:17px;font-weight:600;margin-right:auto}
#stage small{font:italic 12px var(--sans);color:var(--soft);margin-left:6px;font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--soft)}
.seg button.on{background:var(--ink);color:#fff}
.tog{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--soft)}
#vol{width:84px}
.zl.me{border-color:var(--gold);background:rgba(255,248,230,.92);font-weight:600;padding:2px 10px 3px}
.zl.me:after,.zl.fr:after{height:8px}
.zl.fr{border-color:rgba(77,156,143,.6);background:rgba(240,252,248,.9);font-size:14px;padding:2px 9px 3px}
.tl{position:absolute;transform:translate(-50%,-50%);transition:opacity .4s;border:0;background:rgba(43,41,54,.70);color:#fff;border-radius:999px;padding:4px 13px 5px;font-family:var(--serif);font-size:15.5px;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.seg.wrap{flex-wrap:wrap;display:inline-flex;margin:2px 0 4px}
.fl{display:block;font-size:12px;color:var(--soft);margin-top:9px;letter-spacing:.02em}
.sws{display:flex;gap:7px;margin:4px 0 2px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--gold)}
#mus.on{background:rgba(255,246,222,.92);border-color:#d9b45f;color:#7a5510}.np{margin:10px 0 2px;padding:8px 11px;border-radius:10px;background:rgba(255,246,222,.7);border:1px solid var(--line);font-size:13.5px}.song em{color:var(--mut,#857a66);font-style:italic;margin-left:4px}.song div{font-size:12.5px;opacity:.8;margin-top:2px}.song.on{border-color:#d9b45f;background:rgba(255,246,222,.9)}input[data-mvol]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:4px 11px;font-family:var(--serif);font-size:15px}
.chip.more{font:12px var(--sans);color:var(--soft);background:transparent}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:600 19px var(--serif);background:rgba(255,255,255,.8);color:var(--ink);margin-top:6px}
.rules{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px}
.rules li{padding-left:18px;position:relative;margin:2px 0;color:var(--soft)}
.rules li:before{position:absolute;left:0;top:0;font-weight:700}
.rules li.ok:before{content:"✓";color:var(--jade)}
.rules li.no{color:#9a4a2c}.rules li.no:before{content:"•";color:#c0602c}
.pm{display:none;float:right;margin:0 0 4px 8px;padding:4px 10px}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);padding:9px 16px;font-family:var(--serif);font-size:17px;opacity:0;transition:opacity .5s;pointer-events:none}
#toast.on{opacity:1}
#cam{position:absolute;left:14px;bottom:118px;display:flex;flex-direction:column;padding:4px;gap:2px;border-radius:12px;transition:opacity .7s}
#cam button{width:34px;height:34px;border:0;background:transparent;border-radius:8px;font-size:19px;line-height:1;color:var(--ink)}
#cam button:hover{background:rgba(255,255,255,.7)}
body.hall #cam [data-cam=me],body.journey #cam [data-cam=me]{display:none}
body.quiet #cam{opacity:0;pointer-events:none}
#wake{position:absolute;left:50%;bottom:128px;transform:translateX(-50%);padding:12px 16px;background:rgba(255,251,243,.9);text-align:center;font-family:var(--serif);font-size:16.5px;width:max-content;max-width:min(440px,calc(100vw - 28px));z-index:5}
#wake[hidden]{display:none}
#wake .row{justify-content:center;margin-top:8px}
#mdock{position:absolute;right:368px;top:62px;padding:4px 5px;display:flex;align-items:center;gap:1px;border-radius:12px;max-width:calc(100vw - 16px);transition:opacity .7s;z-index:4}
#mdock[hidden]{display:none}
#mdock .mb,#mdock .mt{border:0;background:transparent;border-radius:8px;color:var(--ink);font-size:13px;height:32px}
#mdock .mb{width:32px;font-size:12px}#mdock .mt{padding:0 8px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mdock .mb:hover,#mdock .mt:hover{background:rgba(255,255,255,.7)}
#mdock.open{display:block;width:346px;padding:12px 14px 10px;max-height:calc(100vh - 190px);overflow:auto;background:rgba(255,251,243,.86)}
#mdock .mh{display:flex;justify-content:space-between;align-items:center}#mdock h3{font-size:19px}#mdock .mh .ghost{padding:4px 9px}
#mdock .row{margin-top:8px;flex-wrap:nowrap}#mdock .row input{flex:1;min-width:70px}#mdock .btn{white-space:nowrap}
#mdock .songs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
#mdock .chip{font-size:13px;padding:3px 10px}#mdock .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#mdock p{margin:5px 0}#mdock .seg button{padding:5px 8px}
body.quiet #mdock{opacity:0;pointer-events:none}
#vd{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);padding:6px 16px;font-family:var(--serif);font-size:15.5px;white-space:nowrap;pointer-events:none;opacity:.9}
#vd[hidden]{display:none}
body.vandu #labels,body.vandu #cam{opacity:0;pointer-events:none}
@media (max-width:820px){#cam{bottom:auto;top:118px;left:auto;right:8px}#wake{bottom:172px}#mdock{right:auto;left:8px;top:104px}#vd{left:auto;right:8px;bottom:14px;transform:none;font-size:13px;padding:5px 11px}#mdock.open{right:8px;width:auto;max-height:60vh}}
#err{position:absolute;inset:auto 14px 130px 14px;padding:12px 14px;display:none;color:#7a2a1f}
@media (max-width:820px){#who,#mus{padding:6px 9px}#panel{top:auto;bottom:158px;left:14px;right:14px;width:auto;max-height:36vh}.pm{display:block}body.pmin #panel{max-height:54px;overflow:hidden}#bar{bottom:8px}#hud{display:none!important}.brand small{display:none}#tabs button{padding:6px 10px;font-size:15px}#hide{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── Bản 5: giao diện rộng và rõ hơn ── */
html,body{font-size:15px}
#tabs button,.zl,.tl,.chip,#toast{font-family:var(--sans);font-weight:600;letter-spacing:0}
#tabs button{font-size:15.5px}.zl{font-size:13.5px}.tl{font-size:14px}.chip{font-size:14px;font-weight:400}#toast{font-size:15.5px}
.brand{font-size:20px}#stage{font-size:16px}
#panel{width:400px;bottom:14px;padding:18px 18px 14px;line-height:1.6}
body.hall #panel{bottom:122px}
#panel h2{font-size:23px;line-height:1.25}#panel h3{font-size:16.5px;margin-top:16px}
/* ngoài Đại Thiền Đường: thanh phát thu gọn thành một nút ở góc trái */
body:not(.hall) #bar{left:14px;transform:none;width:auto;padding:8px 14px 8px 8px;bottom:14px}
body:not(.hall) #bar .brow,body:not(.hall) #bar #track{display:none}
body:not(.hall) #bar #time{min-width:0}
body.hall.sermon #bar{display:none}body.hall.sermon #panel{bottom:14px}
#hud{display:none!important}body.hall.radar:not(.sermon) #hud{display:block!important}
#rad{margin-left:2px}#rad.on{background:rgba(255,246,222,.92);border-color:#d9b45f;color:#7a5510}
#sub{position:absolute;left:calc((100vw - 430px)/2);transform:translateX(-50%);bottom:26px;width:min(760px,calc(100vw - 490px));padding:14px 20px 13px;text-align:center;display:none}
body.hall.sermon #sub{display:block}
#sub .src{font-size:12.5px;color:var(--soft);margin-bottom:4px}#sub .ln{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.5}#sub .pl{font-style:italic;color:var(--gold);margin-top:5px;font-size:14px}#sub .ai{font-size:11.5px;color:var(--soft);margin-top:6px;letter-spacing:.02em}
.sut{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:12px;padding:9px 12px;margin:7px 0;font:inherit;color:inherit;cursor:pointer}
.sut.on{border-color:#d9b45f;background:rgba(255,246,222,.92)}.sermon-empty{font-family:var(--serif);font-size:16px;line-height:1.55;margin:12px 0}.sut b{font-family:var(--serif);font-size:16px}.sut em{display:block;font-size:12.5px;color:var(--soft)}.loat{font-family:var(--serif);font-size:15.5px;margin:14px 0 2px}.phan{font-size:12.5px;color:var(--soft);margin:8px 0 4px;letter-spacing:.02em}
.ext{display:block;margin:8px 0;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;color:inherit;text-decoration:none;background:rgba(255,255,255,.5)}
@media (min-width:1500px){#panel{width:430px}}
@media (max-width:820px){
  #top{flex-wrap:wrap;gap:6px;left:8px;right:8px;top:8px}.brand{font-size:17px;padding:5px 11px}
  #tabs{order:3;width:100%;margin:0}#tabs button{flex:1;padding:8px 2px;font-size:13.5px;white-space:nowrap}
  #mus,#who,#hide{margin-left:auto;padding:6px 10px;font-size:13.5px}#who,#hide{margin-left:0}
  #panel{left:8px;right:8px;width:auto;top:auto;bottom:64px;max-height:44vh;padding:14px 14px 10px}
  body.hall #panel{bottom:184px;max-height:36vh}body.hall.sermon #panel{bottom:8px;max-height:34vh}
  body:not(.hall) #bar{left:8px;bottom:8px}
  #sub{left:50%;width:calc(100vw - 16px);bottom:calc(34vh + 20px)}#sub .ln{font-size:16.5px}
  #rad{display:none}
}
/* ── Bản 10: cảnh nền là chính — menu trong suốt, chữ tương phản ── */
.brand{background:none;border:0;box-shadow:none;padding:4px 6px;color:#2b2420;text-shadow:0 0 8px rgba(255,248,232,.95),0 0 2px rgba(255,248,232,.9)}
#tabs.glass{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:6px}
#tabs button{color:#2e2824;font-weight:600;text-shadow:0 0 8px rgba(255,248,232,1),0 0 3px rgba(255,248,232,1),0 0 1px rgba(255,248,232,1);border-radius:0;border-bottom:2px solid transparent;padding:6px 12px}
#tabs button.on{background:none;box-shadow:none;color:#1f1a17;border-bottom-color:#b07a1f}
#tabs button:hover{border-bottom-color:rgba(176,122,31,.45)}
.ghost{background:rgba(255,251,243,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#3a3330}
#panel.glass{background:var(--glass2)}
.tl{background:rgba(43,41,54,.30);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);text-shadow:0 1px 3px rgba(0,0,0,.55);box-shadow:none}
.tl.ladder{transform:translate(0,-50%)}
.tl:hover{background:rgba(43,41,54,.55)}
.zl{background:rgba(255,252,246,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-shadow:0 0 6px rgba(255,250,240,.9);box-shadow:none}
input[data-bn],input[data-bvol]{width:100%}
body.pmin #panel{max-height:54px!important;overflow:hidden!important}
body.pmin #panel h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:820px){.tl{font-size:12px;padding:3px 10px 4px}#tabs.glass{background:rgba(255,251,243,.26);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:12px;padding:2px}}
/* ── #79: nút máy quay + − ◎ trong suốt; thuyết giảng trên điện thoại không che Tôn tượng ── */
#cam.glass{background:rgba(255,251,243,.14);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border-color:rgba(255,255,255,.30);box-shadow:none}
#cam button{color:#2e2824;text-shadow:0 0 8px rgba(255,248,232,1),0 0 3px rgba(255,248,232,1)}
#cam button:hover{background:rgba(255,255,255,.32)}
@media (max-width:820px){
  #cam{top:110px;right:6px;padding:1px;gap:0;border-radius:9px}#cam button{width:28px;height:28px;font-size:16px}
  body.pmin #sub{bottom:68px}
  #sub{padding:14px 12px 8px;max-height:40vh;overflow:hidden}
  #sub.glass{background:linear-gradient(to bottom,rgba(255,251,243,0),rgba(255,251,243,.58) 26%,rgba(255,251,243,.70));-webkit-backdrop-filter:none;backdrop-filter:none;border:0;box-shadow:none}
  #sub .src{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
  #sub .ln{font-size:15.5px;line-height:1.45;text-shadow:0 0 6px rgba(255,250,240,.95)}#sub .pl{font-size:13px;margin-top:3px}
  body.pmin.sermon #panel h2{display:none}
  body.pmin.sermon #panel .sctl{margin-top:0;flex-wrap:nowrap;gap:6px}
  body.pmin.sermon #panel .sctl .btn{padding:5px 10px;font-size:13.5px;white-space:nowrap}
}
/* «Tích lũy tu học» và tự ghi nhận (#88): hoa sen 10 cánh, lịch tu 49 ngày, dấu đã nghe */
.tlhoc{display:flex;gap:12px;align-items:center;margin:4px 0 8px}.tlhoc p{margin:2px 0}
.lotus{width:96px;height:96px;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;max-width:230px;margin:6px 0}
.cal i{display:block;aspect-ratio:1;border-radius:4px;background:rgba(120,110,90,.10);border:1px solid rgba(120,110,90,.16)}
.cal i.on{background:rgba(233,185,73,.38)}.cal i.s{box-shadow:inset 0 -3px 0 rgba(120,150,110,.75)}.cal i.l{border-color:rgba(184,134,43,.75)}
ul.auto{margin:4px 0 6px;padding-left:4px;list-style:none}ul.auto li{margin:2px 0}
.heard{color:#a07a20;font-style:normal}.ev{margin-top:4px}
/* đợt C (#91): Giữ giới, Hạnh của tuần, Nguyện tuần, ngày trai */
.gioi-list{display:grid;gap:6px;margin:4px 0}.gioi-row p{margin:2px 0 0 4px;font-size:13px}
button.gioi{border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.35);font:inherit;font-size:14px;cursor:pointer;color:inherit}
button.gioi.on{background:rgba(233,185,73,.40);border-color:rgba(184,134,43,.7)}
.hanh-list{display:grid;gap:6px;margin:4px 0}
button.hanh{text-align:left;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:rgba(255,255,255,.30);font:inherit;font-size:14px;cursor:pointer;color:inherit}
button.hanh em{display:block;font-size:12px;opacity:.7;font-style:normal;margin-top:2px}button.hanh.on{background:rgba(233,185,73,.32);border-color:rgba(184,134,43,.7)}
.hanh-done,.nguyen{margin:4px 0}.safety{font-size:12px!important;font-style:italic}
.trai{border:1px solid rgba(184,134,43,.45);border-radius:12px;padding:8px 10px;margin:8px 0;background:rgba(255,246,220,.35)}.trai ol{margin:4px 0 4px 18px;padding:0}
.cal i.g{background:rgba(233,185,73,.62)}
/* thẻ Thuyết giảng: ẩn thanh phát thời thiền; thanh phát thu nhỏ thành nút ở góc dưới (#79) */
#barmin{flex:none;width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:8px;font-size:15px;line-height:1}
body:not(.hall) #barmin{display:none}
body.hall.stab #bar{display:none}body.hall.stab #panel{bottom:14px}
body.hall.barmin #bar{left:14px;transform:none;width:auto;padding:8px 8px 8px 8px;bottom:14px}
body.hall.barmin #bar .brow,body.hall.barmin #bar #track{display:none}body.hall.barmin #bar #time{min-width:0}
body.hall.barmin #panel{bottom:14px}
@media (max-width:820px){
  body.hall.stab #panel{bottom:8px;max-height:34vh}
  body.hall.barmin #bar{left:8px;bottom:8px}body.hall.barmin #panel{bottom:72px}
}
</style>
</head>
<body>
<canvas id="gl" aria-label="Cảnh giới 3D: Vân Đảo và Đại Thiền Đường"></canvas>
<div id="ui">
  <div id="top">
    <div class="brand">Vân Đạo</div>
    <nav id="tabs" class="glass" aria-label="Không gian">
      <button data-m="island" class="on">Vân Đảo</button><button data-m="hall">Đại Thiền Đường</button><button data-m="journey">Hành trình</button>
    </nav>
    <button id="mus" class="ghost" title="Nhạc nền Vân Đảo">Nhạc</button><button id="who" class="ghost">Nhân vật</button><button id="hide" class="ghost" title="Phím H">Ẩn giao diện</button>
  </div>
  <div id="labels"></div>
  <section id="hud" class="glass" aria-label="Radar âm thanh">
    <h3>Radar âm thanh 3D</h3>
    <canvas id="radar" width="380" height="380"></canvas>
    <canvas id="scope" width="380" height="76"></canvas>
    <div id="hudtxt"></div>
  </section>
  <aside id="panel" class="glass"></aside>
  <div id="sub" class="glass" aria-live="polite"></div>
  <footer id="bar" class="glass">
    <div class="trow">
      <button id="play" aria-label="Phát hoặc tạm dừng">▶</button>
      <div id="track" role="slider" aria-label="Thanh thời gian" aria-valuemin="0" aria-valuemax="900"><div class="rail"><div class="fill"></div></div><div class="thumb"></div></div>
      <div id="time">00:00 / 15:00</div>
      <button id="barmin" class="ghost" aria-label="Thu nhỏ thanh phát thời thiền" title="Thu nhỏ">▾</button>
    </div>
    <div class="brow">
      <div id="stage"></div>
      <div class="seg" id="bio" aria-label="Trạng thái sinh học">
        <button data-b="samadhi" class="on">Định tĩnh</button><button data-b="uddhacca">Trị phóng dật</button><button data-b="thina">Trị hôn trầm</button>
      </div>
      <label class="tog"><input type="checkbox" id="bin" checked> Nhịp phách hai tai</label>
      <label class="tog">Âm lượng <input type="range" id="vol" min="0" max="1" step="0.01" value="0.9"></label>
      <button id="rad" class="ghost" title="Hiện hoặc ẩn radar âm thanh 3D">Radar</button>
    </div>
  </footer>
  <section id="mdock" class="glass" aria-label="Vân Nhạc" hidden></section>
  <div id="cam" class="glass" aria-label="Máy quay"><button data-cam="in" title="Phóng to" aria-label="Phóng to">+</button><button data-cam="out" title="Thu nhỏ" aria-label="Thu nhỏ">−</button><button data-cam="me" title="Về bên nhân vật" aria-label="Về bên nhân vật">◎</button></div>
  <div id="vd" class="glass" hidden></div>
  <div id="wake" class="glass" role="alertdialog" aria-live="assertive" hidden><span></span><div class="row"><button class="btn" data-wake="yes">Xả thiền</button><button class="btn alt" data-wake="no">Ngồi tiếp</button></div></div>
  <div id="toast" class="glass"></div>
  <div id="err" class="glass"></div>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
