name: Triển khai Vân Đạo lên Cloudflare Workers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers Static Assets
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'van-dao-src/package.json'

      - name: Cài đặt Dependencies
        run: |
          cd van-dao-src
          npm install

      - name: Đóng gói Vân Đạo (Build dist/van-dao.html & public/index.html)
        run: |
          cd van-dao-src
          node build.mjs

      - name: Triển khai lên Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'van-dao-src'
          command: deploy
