# Deploy (PROJECT_ROADMAP.md §14.8, Phụ lục C):
# - merge vào main → staging (tài khoản Cloudflare thứ hai, *.workers.dev)
# - gắn tag vX.Y.Z  → chạy lại toàn bộ ci.yml → production (vandao.ainextbrain.com) → GitHub Release kèm bản HTML đơn
# Không dùng khóa `environment:` (repo private gói Free không có GitHub Environments).
name: deploy
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  staging:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Áp dụng migration D1 staging
        working-directory: workers/api
        run: npx wrangler d1 migrations apply vandao-core-staging --remote --env staging
      - name: Deploy staging
        id: dep
        working-directory: workers/api
        run: |
          npx wrangler deploy --env staging --message "main ${GITHUB_SHA::7}" | tee /tmp/dep.txt
          echo "url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/dep.txt | head -1)" >> "$GITHUB_OUTPUT"
      - name: Kiểm khói staging
        run: npm run e2e:smoke
        env: { E2E_BASE_URL: '${{ steps.dep.outputs.url }}' }

  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  production:
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: write   # tạo GitHub Release
    env:
      # chỉ job này tham chiếu CF_PROD_*; còn secrets cũ CLOUDFLARE_* thì dùng tạm cho tới khi gỡ
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PROD_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Áp dụng migration D1 production
        working-directory: workers/api
        run: npx wrangler d1 migrations apply vandao-core --remote --env=""
      - name: Deploy production
        working-directory: workers/api
        run: npx wrangler deploy --env="" --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
      - name: Kiểm khói production
        run: npm run e2e:smoke
        env: { E2E_BASE_URL: 'https://vandao.ainextbrain.com' }
      - name: GitHub Release kèm bản HTML đơn chạy offline
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp apps/web/dist/van-dao.html "van-dao-${GITHUB_REF_NAME}.html"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "van-dao-${GITHUB_REF_NAME}.html" --clobber
