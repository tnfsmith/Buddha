# Deploy (PROJECT_ROADMAP.md §14.8, Phụ lục C):
# - merge vào main → staging (tài khoản Cloudflare thứ hai, *.workers.dev)
# - gắn tag vX.Y.Z  → chạy lại toàn bộ ci.yml → production (vandao.ainextbrain.com) → GitHub Release kèm bản HTML đơn
# Không dùng khóa `environment:` (repo private gói Free không có GitHub Environments).
name: deploy
on:
  push:
    tags: ['v*']
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  staging:
    # Chỉ CI push của main trong chính repo; PR (kể cả PR giả tên main) không được dùng secrets.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: '${{ github.event.workflow_run.head_sha }}' }
      - name: Bỏ qua CI cũ nếu main đã tiến lên commit khác
        id: tip
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ -n "$tip" ] || { echo "Không đọc được SHA của main"; exit 1; }
          if [ "$tip" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Bỏ qua staging: main đã tiến lên commit khác."
          fi
      - uses: actions/setup-node@v5
        if: steps.tip.outputs.current == 'true'
        with: { node-version: 26, cache: npm }
      - run: npm ci
        if: steps.tip.outputs.current == 'true'
      - run: npm run build
        if: steps.tip.outputs.current == 'true'
      - name: Xác nhận lại main ngay trước khi thay đổi staging
        if: steps.tip.outputs.current == 'true'
        id: ready
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ -n "$tip" ] || { echo "Không đọc được SHA của main"; exit 1; }
          if [ "$tip" = "$VERIFIED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Bỏ qua staging: main đã thay đổi trong lúc dựng."
          fi
      - name: Áp dụng migration D1 staging
        if: steps.tip.outputs.current == 'true' && steps.ready.outputs.current == 'true'
        working-directory: workers/api
        run: npx wrangler d1 migrations apply vandao-core-staging --remote --env staging
      - name: Nạp nội dung đã chọn phát hành vào D1 staging
        if: steps.tip.outputs.current == 'true' && steps.ready.outputs.current == 'true'
        run: node scripts/import-content.mjs --env staging --remote
      - name: Deploy staging
        if: steps.tip.outputs.current == 'true' && steps.ready.outputs.current == 'true'
        id: dep
        working-directory: workers/api
        run: |
          set -o pipefail   # wrangler lỗi thì bước này phải đỏ (không bị `tee` che mất mã thoát)
          npx wrangler deploy --env staging --message "main ${VERIFIED_SHA::7}" | tee /tmp/dep.txt
          url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/dep.txt | head -1)
          [ -n "$url" ] || { echo "Không đọc được URL staging từ wrangler, dừng để kiểm khói không chạy nhầm bản cục bộ"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Kiểm khói staging
        if: steps.tip.outputs.current == 'true' && steps.ready.outputs.current == 'true'
        run: npm run e2e:smoke
        env: { E2E_BASE_URL: '${{ steps.dep.outputs.url }}' }

  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  production:
    needs: [verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions:
      contents: write   # tạo GitHub Release
    env:
      # chỉ job này tham chiếu CF_PROD_*; còn secrets cũ CLOUDFLARE_* thì dùng tạm cho tới khi gỡ
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_PROD_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_PROD_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Áp dụng migration D1 production
        working-directory: workers/api
        run: npx wrangler d1 migrations apply vandao-core --remote --env=""
      - name: Nạp nội dung đã chọn phát hành vào D1 production
        run: node scripts/import-content.mjs --env production --remote
      - name: Deploy production
        working-directory: workers/api
        run: npx wrangler deploy --env="" --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}"
      - name: Kiểm khói production
        run: npm run e2e:smoke
        env: { E2E_BASE_URL: 'https://vandao.ainextbrain.com' }
      - name: GitHub Release kèm bản HTML đơn chạy offline
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp apps/web/dist/van-dao.html "van-dao-${GITHUB_REF_NAME}.html"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "van-dao-${GITHUB_REF_NAME}.html" --clobber
