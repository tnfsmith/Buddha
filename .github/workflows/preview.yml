# Bản preview cho mỗi PR trên tài khoản Cloudflare staging (PROJECT_ROADMAP.md §14.8). Không đụng production.
name: preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  migration-policy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      remote_allowed: ${{ steps.policy.outputs.remote_allowed }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 26 }
      - name: Chặn preview có migration chưa merge (#35)
        id: policy
        run: node scripts/preview-migration-check.mjs
  preview:
    needs: [migration-policy]
    # chỉ PR từ chính repo mới được dùng secrets
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.migration-policy.outputs.remote_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_STAGING_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_STAGING_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Tạo Worker staging nếu chưa có
        working-directory: workers/api
        run: npx wrangler deployments list --env staging >/dev/null 2>&1 || npx wrangler deploy --env staging
      - name: Tải phiên bản preview (không đổi bản staging đang chạy)
        id: up
        working-directory: workers/api
        run: |
          set -o pipefail   # wrangler lỗi thì bước này phải đỏ (không bị `tee` che mất mã thoát)
          npx wrangler versions upload --env staging --preview-alias "pr-$PR" --message "PR #$PR ${GITHUB_SHA::7}" | tee /tmp/up.txt
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' /tmp/up.txt | head -1)
          [ -n "$url" ] || url=$(grep -oE 'https://[^ ]+\.workers\.dev' /tmp/up.txt | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Lighthouse trên bản preview (điện thoại và máy tính, T1.3)
        if: steps.up.outputs.url != ''
        continue-on-error: true
        env: { URL: '${{ steps.up.outputs.url }}' }
        run: |
          # tắt WebGL: runner không có GPU, cảnh 3D bằng SwiftShader làm Lighthouse báo "trang ngừng phản hồi".
          # Lighthouse đo lớp giao diện 2D (§12.5: 2D tương tác < 2,5 s); hiệu năng 3D đo ở tests/e2e/perf.spec.js.
          flags="--no-sandbox --headless=new --disable-3d-apis"
          cats="performance,accessibility,best-practices,seo"
          npx -y @lhci/cli@0.16.1 collect --url="$URL/" --numberOfRuns=1 --settings.chromeFlags="$flags" --settings.onlyCategories="$cats"
          npx -y @lhci/cli@0.16.1 collect --url="$URL/" --numberOfRuns=1 --additive --settings.preset=desktop --settings.chromeFlags="$flags" --settings.onlyCategories="$cats"
          node scripts/lh-summary.mjs > /tmp/lh.md; cat /tmp/lh.md
      - name: Lưu báo cáo Lighthouse
        if: always() && steps.up.outputs.url != ''
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: lighthouse-pr-${{ github.event.pull_request.number }}
          path: .lighthouseci/
          retention-days: 14
          if-no-files-found: ignore
      - name: Kiểm khói bản preview
        if: steps.up.outputs.url != ''
        run: npm run e2e:smoke
        env: { E2E_BASE_URL: '${{ steps.up.outputs.url }}' }
      - name: Bình luận link preview vào PR
        if: steps.up.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.up.outputs.url }}
        run: |
          body="Preview PR #$PR (tài khoản Cloudflare staging): $URL — commit ${GITHUB_SHA::7}"
          if [ -s /tmp/lh.md ]; then body="$body"$'\n\n'"$(cat /tmp/lh.md)"; fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
