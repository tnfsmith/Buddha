# Kiểm tra PR/main; deploy.yml chỉ nhận đúng SHA đã xanh, hoặc gọi lại khi gắn tag.
name: ci
on:
  pull_request:
    # labeled/unlabeled: gắn nhãn shared-ok sau khi mở PR thì lane-guard chạy lại ngay (lần chạy cũ tự hủy)
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_call:
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    name: check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [26, 24]   # Node 24 chỉ giữ trong GĐ0 để bắt lỗi tương thích; gỡ khi ổn
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }   # lane-guard cần lịch sử để so với nhánh gốc
      - uses: actions/setup-node@v5
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - name: Lane-guard (§14.7)
        if: github.event_name == 'pull_request'
        run: node scripts/lane-guard.mjs
        env:   # truyền qua env, không nội suy thẳng tên nhánh vào lệnh
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
      - run: npm run lint
      - run: npm test
      - name: Kiểm bộ giám sát Hermes khi có trong bản tích hợp
        if: hashFiles('ops/hermes/vandao-ops/daily-report.test.mjs') != ''
        run: node --test ops/hermes/vandao-ops/daily-report.test.mjs
      - run: npm run build
      - run: npm run size
      - run: npm run check:migrations
      - name: Kiểm tra đóng gói Worker (wrangler dry-run, staging và production)
        if: matrix.node == 26
        working-directory: workers/api
        run: |
          npx wrangler deploy --dry-run --env staging --outdir /tmp/wr-staging
          npx wrangler deploy --dry-run --env="" --outdir /tmp/wr-production
      - name: Chạy migration D1 trên SQLite của workerd (cục bộ, không đụng tài khoản Cloudflare)
        if: matrix.node == 26
        working-directory: workers/api
        run: npx wrangler d1 migrations apply vandao-core-staging --local --env staging
      - name: Lưu bản HTML đơn
        if: matrix.node == 26
        uses: actions/upload-artifact@v5
        with: { name: van-dao-html, path: apps/web/dist/van-dao.html, retention-days: 14 }

  smoke:
    name: smoke (Playwright ${{ matrix.shard }}/3)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Kiểm khói Playwright (WebGL SwiftShader)
        # Mỗi runner dựng WebGL bằng một worker để các ca không tranh CPU.
        run: npm run e2e:smoke -- --shard="$SMOKE_SHARD/3" --workers=1
        env:
          SMOKE_SHARD: ${{ matrix.shard }}

  account:
    name: account (Worker + D1 cục bộ)
    runs-on: ubuntu-latest
    # Hai ca hiện có giới hạn 15 + 10 phút; thêm thời gian cài/dựng, không tăng timeout của ca.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Hai ca tài khoản đầy đủ, không giả lập API và không được bỏ qua
        run: node scripts/account-ci.mjs
      - name: Lưu kết quả tài khoản của đúng commit
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: account-${{ github.sha }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
