.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(80,60,20,.10)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.01em}
button{font:inherit;color:inherit;cursor:pointer}
#top{position:absolute;left:14px;right:14px;top:12px;display:flex;align-items:center;gap:12px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{padding:7px 14px;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1.1}
.brand small{display:block;font:11px/1.2 var(--sans);color:var(--soft);letter-spacing:.02em}
#tabs{margin:0 auto;display:flex;padding:4px;gap:2px}
#tabs button{border:0;background:transparent;padding:7px 16px;border-radius:10px;font-family:var(--serif);font-size:17px;color:var(--soft)}
#tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(80,60,20,.14)}
.ghost{border:1px solid var(--line);background:var(--glass);border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--soft)}
#labels{position:absolute;inset:0;pointer-events:none}
.zl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;transition:opacity .35s;will-change:left,top;border:1px solid var(--line);background:rgba(255,252,246,.86);border-radius:999px;padding:3px 11px 4px;font-family:var(--serif);font-size:15px;white-space:nowrap;box-shadow:0 2px 10px rgba(80,60,20,.12)}
.zl:after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--gold2)}
.zl.lock{color:#8b8796;background:rgba(255,252,246,.6)}
.zl.on{background:#fff;border-color:var(--gold)}
.zl small{font:10.5px var(--sans);color:var(--soft);margin-left:5px}
#panel{position:absolute;right:14px;top:70px;bottom:118px;width:340px;max-width:calc(100vw - 28px);padding:16px 16px 12px;overflow:auto}
#panel h2{font-size:23px;line-height:1.15}
#panel h3{font-size:17px;margin-top:14px}
#panel p{margin:6px 0}
.pali{font-style:italic;color:var(--soft);font-size:12.5px}
.muted{color:var(--soft);font-size:12.5px}
.note{font-size:12px;color:#7a5a1f;background:rgba(217,179,106,.18);border-radius:8px;padding:6px 9px;margin-top:8px}
.btn{border:1px solid var(--gold);background:var(--gold);color:#fff;border-radius:10px;padding:7px 14px;font-weight:600}
.btn.alt{background:transparent;color:var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bars{display:grid;gap:7px;margin-top:10px}
.bar3{display:grid;grid-template-columns:52px 1fr 54px;gap:8px;align-items:center;font-size:12.5px}
.bar3 i{display:block;height:7px;border-radius:9px;background:rgba(0,0,0,.08);overflow:hidden}
.bar3 i b{display:block;height:100%;border-radius:9px}
.task{border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-top:9px;background:rgba(255,255,255,.55)}
.task.done{background:rgba(255,255,255,.3)}
.task .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.task h4{margin:1px 0 3px;font:600 16.5px var(--serif)}
.task p{margin:0;font-size:13px;color:#3d3a48}
.task details{margin-top:8px}
.task summary{cursor:pointer;font-size:12.5px;color:var(--soft)}
.sl{display:grid;grid-template-columns:84px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;margin-top:5px}
input[type=range]{width:100%;accent-color:var(--gold)}
.chk{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin-top:6px}
textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:13px var(--sans);background:rgba(255,255,255,.7);resize:vertical;margin-top:6px}
.tier{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin-top:8px;background:rgba(255,255,255,.5);cursor:pointer;display:block;width:100%;text-align:left}
.tier.on{border-color:var(--gold);background:#fff}
.tier b{font:600 16.5px var(--serif)}
.tier div{font-size:12.5px;color:#3d3a48;margin-top:3px}
.stg{display:grid;grid-template-columns:46px 1fr;gap:8px;padding:7px 8px;border-radius:10px;border:0;background:transparent;width:100%;text-align:left}
.stg.on{background:#fff;box-shadow:0 1px 5px rgba(80,60,20,.12)}
.stg span{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--soft);padding-top:2px}
.stg b{font:600 15.5px var(--serif);display:block}
.stg em{font-size:12px;color:var(--soft);font-style:normal}
#hud{position:absolute;left:14px;top:70px;width:214px;padding:12px;display:none}
body.hall #hud{display:block}
#hud h3{font-size:15px;margin-bottom:6px}
#radar{width:190px;height:190px;display:block}
#scope{width:190px;height:38px;display:block;margin-top:8px;border-radius:8px;background:rgba(43,41,54,.06)}
#hudtxt{font-size:12px;color:var(--soft);margin-top:6px;min-height:34px}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(980px,calc(100vw - 28px));padding:10px 14px 9px}
.trow{display:flex;align-items:center;gap:12px}
#play{width:44px;height:44px;border-radius:50%;border:0;background:var(--gold);color:#fff;font-size:17px;flex:none;display:grid;place-items:center;box-shadow:0 3px 12px rgba(169,121,44,.4)}
#time{font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--soft);min-width:98px;text-align:center}
#track{position:relative;flex:1;height:26px;cursor:pointer;touch-action:none}
#track .rail{position:absolute;left:0;right:0;top:11px;height:5px;border-radius:5px;background:rgba(43,41,54,.12);overflow:hidden}
#track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold2),var(--gold))}
#track .tick{position:absolute;top:7px;width:1px;height:13px;background:rgba(43,41,54,.35)}
#track .thumb{position:absolute;top:6px;width:15px;height:15px;margin-left:-7.5px;border-radius:50%;background:#fff;border:2px solid var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.brow{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
#stage{font-family:var(--serif);font-size:17px;font-weight:600;margin-right:auto}
#stage small{font:italic 12px var(--sans);color:var(--soft);margin-left:6px;font-weight:400}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;font-size:12.5px;color:var(--soft)}
.seg button.on{background:var(--ink);color:#fff}
.tog{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--soft)}
#vol{width:84px}
.zl.me{border-color:var(--gold);background:rgba(255,248,230,.92);font-weight:600;padding:2px 10px 3px}
.zl.me:after,.zl.fr:after{height:8px}
.zl.fr{border-color:rgba(77,156,143,.6);background:rgba(240,252,248,.9);font-size:14px;padding:2px 9px 3px}
.tl{position:absolute;transform:translate(-50%,-50%);transition:opacity .4s;border:0;background:rgba(43,41,54,.70);color:#fff;border-radius:999px;padding:4px 13px 5px;font-family:var(--serif);font-size:15.5px;white-space:nowrap;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.seg.wrap{flex-wrap:wrap;display:inline-flex;margin:2px 0 4px}
.fl{display:block;font-size:12px;color:var(--soft);margin-top:9px;letter-spacing:.02em}
.sws{display:flex;gap:7px;margin:4px 0 2px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 1px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 2px var(--gold)}
#mus.on{background:rgba(255,246,222,.92);border-color:#d9b45f;color:#7a5510}.np{margin:10px 0 2px;padding:8px 11px;border-radius:10px;background:rgba(255,246,222,.7);border:1px solid var(--line);font-size:13.5px}.song em{color:var(--mut,#857a66);font-style:italic;margin-left:4px}.song div{font-size:12.5px;opacity:.8;margin-top:2px}.song.on{border-color:#d9b45f;background:rgba(255,246,222,.9)}input[data-mvol]{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.7);border-radius:999px;padding:4px 11px;font-family:var(--serif);font-size:15px}
.chip.more{font:12px var(--sans);color:var(--soft);background:transparent}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:600 19px var(--serif);background:rgba(255,255,255,.8);color:var(--ink);margin-top:6px}
.rules{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px}
.rules li{padding-left:18px;position:relative;margin:2px 0;color:var(--soft)}
.rules li:before{position:absolute;left:0;top:0;font-weight:700}
.rules li.ok:before{content:"✓";color:var(--jade)}
.rules li.no{color:#9a4a2c}.rules li.no:before{content:"•";color:#c0602c}
.pm{display:none;float:right;margin:0 0 4px 8px;padding:4px 10px}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);padding:9px 16px;font-family:var(--serif);font-size:17px;opacity:0;transition:opacity .5s;pointer-events:none}
#toast.on{opacity:1}
#err{position:absolute;inset:auto 14px 130px 14px;padding:12px 14px;display:none;color:#7a2a1f}
@media (max-width:820px){#who,#mus{padding:6px 9px}#panel{top:auto;bottom:158px;left:14px;right:14px;width:auto;max-height:36vh}.pm{display:block}body.pmin #panel{max-height:54px;overflow:hidden}#bar{bottom:8px}#hud{display:none!important}.brand small{display:none}#tabs button{padding:6px 10px;font-size:15px}#hide{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── Bản 5: giao diện rộng và rõ hơn ── */
html,body{font-size:15px}
#tabs button,.zl,.tl,.chip,#toast{font-family:var(--sans);font-weight:600;letter-spacing:0}
#tabs button{font-size:15.5px}.zl{font-size:13.5px}.tl{font-size:14px}.chip{font-size:14px;font-weight:400}#toast{font-size:15.5px}
.brand{font-size:20px}#stage{font-size:16px}
#panel{width:400px;bottom:14px;padding:18px 18px 14px;line-height:1.6}
body.hall #panel{bottom:122px}
#panel h2{font-size:23px;line-height:1.25}#panel h3{font-size:16.5px;margin-top:16px}
/* ngoài Đại Thiền Đường: thanh phát thu gọn thành một nút ở góc trái */
body:not(.hall) #bar{left:14px;transform:none;width:auto;padding:8px 14px 8px 8px;bottom:14px}
body:not(.hall) #bar .brow,body:not(.hall) #bar #track{display:none}
body:not(.hall) #bar #time{min-width:0}
body.hall.sermon #bar{display:none}body.hall.sermon #panel{bottom:14px}
#hud{display:none!important}body.hall.radar:not(.sermon) #hud{display:block!important}
#rad{margin-left:2px}#rad.on{background:rgba(255,246,222,.92);border-color:#d9b45f;color:#7a5510}
#sub{position:absolute;left:calc((100vw - 430px)/2);transform:translateX(-50%);bottom:26px;width:min(760px,calc(100vw - 490px));padding:14px 20px 13px;text-align:center;display:none}
body.hall.sermon #sub{display:block}
#sub .src{font-size:12.5px;color:var(--soft);margin-bottom:4px}#sub .ln{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.5}#sub .pl{font-style:italic;color:var(--gold);margin-top:5px;font-size:14px}
.sut{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.62);border-radius:12px;padding:9px 12px;margin:7px 0;font:inherit;color:inherit;cursor:pointer}
.sut.on{border-color:#d9b45f;background:rgba(255,246,222,.92)}.sut b{font-family:var(--serif);font-size:16px}.sut em{display:block;font-size:12.5px;color:var(--soft)}
.ext{display:block;margin:8px 0;padding:9px 12px;border:1px dashed var(--line);border-radius:12px;color:inherit;text-decoration:none;background:rgba(255,255,255,.5)}
@media (min-width:1500px){#panel{width:430px}}
@media (max-width:820px){
  #top{flex-wrap:wrap;gap:6px;left:8px;right:8px;top:8px}.brand{font-size:17px;padding:5px 11px}
  #tabs{order:3;width:100%;margin:0}#tabs button{flex:1;padding:8px 2px;font-size:13.5px;white-space:nowrap}

}

.brand{background:none;border:0;box-shadow:none;padding:4px 6px;color:#2b2420;text-shadow:0 0 8px rgba(255,248,232,.95),0 0 2px rgba(255,248,232,.9)}
#tabs.glass{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0;gap:6px}
#tabs button{color:#2e2824;font-weight:600;text-shadow:0 0 8px rgba(255,248,232,1),0 0 3px rgba(255,248,232,1),0 0 1px rgba(255,248,232,1);border-radius:0;border-bottom:2px solid transparent;padding:6px 12px}
#tabs button.on{background:none;box-shadow:none;color:#1f1a17;border-bottom-color:#b07a1f}

.ghost{background:rgba(255,251,243,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#3a3330}
#panel.glass{background:var(--glass2)}
.tl{background:rgba(43,41,54,.30);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.28);text-shadow:0 1px 3px rgba(0,0,0,.55);box-shadow:none}

.zl{background:rgba(255,252,246,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-shadow:0 0 6px rgba(255,250,240,.9);box-shadow:none}
input[data-bn],input[data-bvol]{width:100%}

v\xE0 t\u1EF1 h\xE0nh h\u1EA1 th\xE2n m\xECnh.","Tr\xE1nh hai c\u1EF1c \u0111oan \u1EA5y l\xE0 con \u0111\u01B0\u1EDDng Trung \u0111\u1EA1o, \u0111\u01B0a \u0111\u1EBFn an t\u1ECBnh, th\u1EAFng tr\xED, gi\xE1c ng\u1ED9, Ni\u1EBFt-b\xE0n.","Trung \u0111\u1EA1o \u1EA5y l\xE0 Th\xE1nh \u0111\u1EA1o t\xE1m ng\xE0nh: ch\xE1nh ki\u1EBFn, ch\xE1nh t\u01B0 duy, ch\xE1nh ng\u1EEF, ch\xE1nh nghi\u1EC7p, ch\xE1nh m\u1EA1ng, ch\xE1nh tinh t\u1EA5n, ch\xE1nh ni\u1EC7m, ch\xE1nh \u0111\u1ECBnh.","\u0110\xE2y l\xE0 s\u1EF1 th\u1EADt v\u1EC1 kh\u1ED5: sinh, gi\xE0, b\u1EC7nh, ch\u1EBFt l\xE0 kh\u1ED5; g\u1EA7n \u0111i\u1EC1u kh\xF4ng \u01B0a, xa \u0111i\u1EC1u y\xEAu th\xEDch, c\u1EA7u m\xE0 kh\xF4ng \u0111\u01B0\u1EE3c l\xE0 kh\u1ED5.","\u0110\xE2y l\xE0 nguy\xEAn nh\xE2n c\u1EE7a kh\u1ED5: kh\xE1t \xE1i \u0111i c\xF9ng h\u1EF7 v\xE0 tham, t\xECm vui h\u1EBFt ch\u1ED7 n\xE0y \u0111\u1EBFn ch\u1ED7 kh\xE1c.","\u0110\xE2y l\xE0 s\u1EF1 ch\u1EA5m d\u1EE9t kh\u1ED5: kh\xE1t \xE1i \u1EA5y \u0111\u01B0\u1EE3c bu\xF4ng b\u1ECF, l\xECa xa, \u0111o\u1EA1n t\u1EADn kh\xF4ng c\xF2n d\u01B0.","Kh\u1ED5 c\u1EA7n \u0111\u01B0\u1EE3c hi\u1EC3u r\xF5. Nguy\xEAn nh\xE2n c\u1EE7a kh\u1ED5 c\u1EA7n \u0111\u01B0\u1EE3c bu\xF4ng b\u1ECF. S\u1EF1 ch\u1EA5m d\u1EE9t kh\u1ED5 c\u1EA7n \u0111\u01B0\u1EE3c ch\u1EE9ng ng\u1ED9. Con \u0111\u01B0\u1EDDng c\u1EA7n \u0111\u01B0\u1EE3c tu t\u1EADp."]},{id:"vo-nga-tuong",name:"V\xF4 Ng\xE3 T\u01B0\u1EDBng",pali:"Anattalakkha\u1E47a Sutta",ref:"T\u01B0\u01A1ng \u01AFng B\u1ED9, SN 22.59",key:"R\u016Bpa\u1E43, bhikkhave, anatt\u0101.",lines:["Th\xE2n n\xE0y kh\xF4ng ph\u1EA3i l\xE0 t\u1EF1 ng\xE3. N\u1EBFu l\xE0 t\u1EF1 ng\xE3, th\xE2n \u0111\xE3 kh\xF4ng \u0111\u01B0a \u0111\u1EBFn b\u1EC7nh ho\u1EA1n, v\xE0 ta c\xF3 th\u1EC3 b\u1EA3o: th\xE2n h\xE3y th\u1EBF n\xE0y, \u0111\u1EEBng th\u1EBF kia.","C\u1EA3m th\u1ECD, tri gi\xE1c, c\xE1c h\xE0nh v\xE0 th\u1EE9c c\u0169ng v\u1EADy: kh\xF4ng sai khi\u1EBFn \u0111\u01B0\u1EE3c theo \xFD m\xECnh, n\xEAn kh\xF4ng ph\u1EA3i l\xE0 t\u1EF1 ng\xE3.","Th\xE2n l\xE0 th\u01B0\u1EDDng hay v\xF4 th\u01B0\u1EDDng? L\xE0 v\xF4 th\u01B0\u1EDDng. C\xE1i g\xEC v\xF4 th\u01B0\u1EDDng th\xEC \u0111\u01B0a \u0111\u1EBFn kh\u1ED5.","C\xE1i g\xEC v\xF4 th\u01B0\u1EDDng, kh\u1ED5, ch\u1ECBu bi\u1EBFn \u0111\u1ED5i, c\xF3 n\xEAn xem: c\xE1i n\xE0y l\xE0 c\u1EE7a t\xF4i, l\xE0 t\xF4i, l\xE0 t\u1EF1 ng\xE3 c\u1EE7a t\xF4i? Kh\xF4ng n\xEAn.","V\u1EADy m\u1ECDi th\xE2n, m\u1ECDi c\u1EA3m th\u1ECD, tri gi\xE1c, h\xE0nh, th\u1EE9c, d\xF9 qu\xE1 kh\u1EE9, v\u1ECB lai hay hi\u1EC7n t\u1EA1i, trong hay ngo\xE0i, th\xF4 hay t\u1EBF, c\u1EA7n \u0111\u01B0\u1EE3c th\u1EA5y \u0111\xFAng nh\u01B0 th\u1EADt: kh\xF4ng ph\u1EA3i c\u1EE7a t\xF4i, kh\xF4ng ph\u1EA3i l\xE0 t\xF4i.","Th\u1EA5y nh\u01B0 v\u1EADy, ng\u01B0\u1EDDi h\u1ECDc Ph\xE1p nh\xE0m ch\xE1n n\u0103m u\u1EA9n; do nh\xE0m ch\xE1n n\xEAn ly tham; do ly tham n\xEAn \u0111\u01B0\u1EE3c gi\u1EA3i tho\xE1t."]},{id:"tu-bi",name:"T\xE2m T\u1EEB",pali:"Kara\u1E47\u012Byamett\u0101 Sutta",ref:"Kinh T\u1EADp, Sn 1.8",key:"Sabbe satt\u0101 bhavantu sukhitatt\u0101.",lines:["Ng\u01B0\u1EDDi kh\xE9o tu, mu\u1ED1n \u0111\u1EA1t an t\u1ECBnh, n\xEAn s\u1ED1ng ngay th\u1EB3ng, nhu h\xF2a, khi\xEAm t\u1ED1n, bi\u1EBFt \u0111\u1EE7, \xEDt b\u1EADn r\u1ED9n, c\xE1c c\u0103n l\u1EAFng d\u1ECBu.","Kh\xF4ng l\xE0m \u0111i\u1EC1u g\xEC, d\xF9 nh\u1ECF, m\xE0 b\u1EADc tr\xED c\xF3 th\u1EC3 ch\xEA tr\xE1ch.","H\xE3y mong cho m\u1ECDi lo\xE0i \u0111\u01B0\u1EE3c an vui: d\xF9 y\u1EBFu hay m\u1EA1nh, l\u1EDBn hay nh\u1ECF, th\u1EA5y \u0111\u01B0\u1EE3c hay kh\xF4ng th\u1EA5y, \u1EDF g\u1EA7n hay \u1EDF xa, \u0111\xE3 sinh hay s\u1EAFp sinh.","\u0110\u1EEBng l\u1EEBa d\u1ED1i ai, \u0111\u1EEBng khinh r\u1EBB ai \u1EDF b\u1EA5t c\u1EE9 \u0111\xE2u; \u0111\u1EEBng v\xEC gi\u1EADn h\u1EDDn m\xE0 mong ai ch\u1ECBu kh\u1ED5.","Nh\u01B0 ng\u01B0\u1EDDi m\u1EB9 l\u1EA5y m\u1EA1ng m\xECnh che ch\u1EDF \u0111\u1EE9a con m\u1ED9t, h\xE3y nu\xF4i t\xE2m r\u1ED9ng l\u1EDBn kh\xF4ng gi\u1EDBi h\u1EA1n v\u1EDBi m\u1ECDi lo\xE0i.","H\xE3y tr\u1EA3i t\xE2m t\u1EEB kh\u1EAFp th\u1EBF gian: b\xEAn tr\xEAn, b\xEAn d\u01B0\u1EDBi, b\u1ED1n ph\xEDa, kh\xF4ng h\u1EB9p h\xF2i, kh\xF4ng o\xE1n th\xF9.","Khi \u0111i, \u0111\u1EE9ng, ng\u1ED3i, n\u1EB1m, l\xFAc n\xE0o c\xF2n th\u1EE9c, h\xE3y gi\u1EEF ni\u1EC7m n\xE0y. \u0110\xF3 g\u1ECDi l\xE0 s\u1ED1ng v\u1EDBi ph\u1EA1m tr\xFA."]},{id:"diem-lanh",name:"\u0110i\u1EC1m L\xE0nh",pali:"Ma\u1E45gala Sutta",ref:"Kinh T\u1EADp, Sn 2.4",key:"Eta\u1E43 ma\u1E45galamuttama\u1E43.",lines:["Kh\xF4ng g\u1EA7n k\u1EBB ngu, th\xE2n c\u1EADn b\u1EADc tr\xED, k\xEDnh tr\u1ECDng ng\u01B0\u1EDDi \u0111\xE1ng k\xEDnh: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng.","\u1EDE n\u01A1i th\xEDch h\u1EE3p, c\xF3 ph\u01B0\u1EDBc \u0111\xE3 t\u1EA1o, t\u1EF1 h\u01B0\u1EDBng m\xECnh theo \u0111\u01B0\u1EDDng ch\xE1nh: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng.","H\u1ECDc r\u1ED9ng, gi\u1ECFi ngh\u1EC1, gi\u1EEF k\u1EF7 lu\u1EADt, n\xF3i l\u1EDDi kh\xE9o l\xE9o: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng.","Ph\u1EE5ng d\u01B0\u1EE1ng m\u1EB9 cha, ch\u0103m s\xF3c gia \u0111\xECnh, l\xE0m vi\u1EC7c kh\xF4ng r\u1ED1i lo\u1EA1n: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng.","B\u1ED1 th\xED, s\u1ED1ng \u0111\xFAng Ph\xE1p, gi\xFAp \u0111\u1EE1 ng\u01B0\u1EDDi th\xE2n, vi\u1EC7c l\xE0m kh\xF4ng l\u1ED7i: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng.","K\xEDnh tr\u1ECDng, khi\xEAm nh\u01B0\u1EDDng, bi\u1EBFt \u0111\u1EE7, bi\u1EBFt \u01A1n, \u0111\xFAng l\xFAc nghe Ph\xE1p: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng.","Khi ch\u1EA1m vi\u1EC7c \u0111\u1EDDi m\xE0 t\xE2m kh\xF4ng dao \u0111\u1ED9ng, kh\xF4ng s\u1EA7u, kh\xF4ng nhi\u1EC5m, an \u1ED5n: l\xE0 \u0111i\u1EC1m l\xE0nh t\u1ED1i th\u01B0\u1EE3ng."]},{id:"kalama",name:"K\u0101l\u0101ma",pali:"Kesamutti Sutta",ref:"T\u0103ng Chi B\u1ED9, AN 3.65",lines:["Ch\u1EDB v\u1ED9i tin ch\u1EC9 v\xEC nghe truy\u1EC1n l\u1EA1i, v\xEC truy\u1EC1n th\u1ED1ng, v\xEC l\u1EDDi \u0111\u1ED3n, hay v\xEC kinh s\xE1ch ghi nh\u01B0 v\u1EADy.","Ch\u1EDB v\u1ED9i tin ch\u1EC9 v\xEC l\xFD lu\u1EADn, suy di\u1EC5n, v\xEC x\xE9t b\u1EC1 ngo\xE0i, v\xEC h\u1EE3p \u0111\u1ECBnh ki\u1EBFn, v\xEC ng\u01B0\u1EDDi n\xF3i c\xF3 v\u1EBB \u0111\xE1ng tin, hay v\xEC \u0111\xF3 l\xE0 th\u1EA7y m\xECnh.","Khi t\u1EF1 m\xECnh bi\u1EBFt: c\xE1c \u0111i\u1EC1u n\xE0y b\u1EA5t thi\u1EC7n, c\xF3 l\u1ED7i, b\u1ECB ng\u01B0\u1EDDi tr\xED ch\xEA, l\xE0m theo th\xEC \u0111\u01B0a \u0111\u1EBFn h\u1EA1i v\xE0 kh\u1ED5; khi \u1EA5y h\xE3y t\u1EEB b\u1ECF.","Khi t\u1EF1 m\xECnh bi\u1EBFt: c\xE1c \u0111i\u1EC1u n\xE0y l\xE0 thi\u1EC7n, kh\xF4ng l\u1ED7i, \u0111\u01B0\u1EE3c ng\u01B0\u1EDDi tr\xED khen, l\xE0m theo th\xEC \u0111\u01B0a \u0111\u1EBFn l\u1EE3i \xEDch v\xE0 an vui; khi \u1EA5y h\xE3y s\u1ED1ng theo.","Tham, s\xE2n, si kh\u1EDFi l\xEAn trong m\u1ED9t ng\u01B0\u1EDDi l\xE0 \u0111em l\u1EA1i b\u1EA5t h\u1EA1nh cho ng\u01B0\u1EDDi \u1EA5y.","Ng\u01B0\u1EDDi l\xECa tham, s\xE2n, si, t\u1EC9nh gi\xE1c, ch\xE1nh ni\u1EC7m, tr\u1EA3i t\xE2m t\u1EEB, bi, h\u1EF7, x\u1EA3 kh\u1EAFp c\xE1c ph\u01B0\u01A1ng, s\u1ED1ng an \u1ED5n ngay trong hi\u1EC7n t\u1EA1i."]},{id:"niem-xu",name:"Ni\u1EC7m X\u1EE9",pali:"Satipa\u1E6D\u1E6Dh\u0101na Sutta",ref:"Trung B\u1ED9, MN 10",key:"Ek\u0101yano aya\u1E43, bhikkhave, maggo satt\u0101na\u1E43 visuddhiy\u0101.",lines:["\u0110\xE2y l\xE0 con \u0111\u01B0\u1EDDng th\u1EB3ng \u0111\u01B0a \u0111\u1EBFn thanh t\u1ECBnh cho ch\xFAng sinh, v\u01B0\u1EE3t s\u1EA7u bi, d\u1EE9t kh\u1ED5 \u01B0u, ch\u1EE9ng ng\u1ED9 Ni\u1EBFt-b\xE0n: \u0111\xF3 l\xE0 b\u1ED1n ni\u1EC7m x\u1EE9.","Qu\xE1n th\xE2n tr\xEAn th\xE2n, qu\xE1n th\u1ECD tr\xEAn th\u1ECD, qu\xE1n t\xE2m tr\xEAn t\xE2m, qu\xE1n ph\xE1p tr\xEAn ph\xE1p: nhi\u1EC7t t\xE2m, t\u1EC9nh gi\xE1c, ch\xE1nh ni\u1EC7m, b\u1ECF tham \u01B0u \u1EDF \u0111\u1EDDi.","Ch\xE1nh ni\u1EC7m, h\xEDt v\xE0o; ch\xE1nh ni\u1EC7m, th\u1EDF ra. H\u01A1i d\xE0i bi\u1EBFt l\xE0 d\xE0i, h\u01A1i ng\u1EAFn bi\u1EBFt l\xE0 ng\u1EAFn.","Khi \u0111i bi\u1EBFt m\xECnh \u0111ang \u0111i; \u0111\u1EE9ng, ng\u1ED3i, n\u1EB1m c\u0169ng bi\u1EBFt r\xF5 nh\u01B0 v\u1EADy.","C\u1EA3m th\u1ECD vui bi\u1EBFt l\xE0 vui, kh\u1ED5 bi\u1EBFt l\xE0 kh\u1ED5, kh\xF4ng kh\u1ED5 kh\xF4ng vui c\u0169ng bi\u1EBFt r\xF5.","T\xE2m c\xF3 tham bi\u1EBFt c\xF3 tham; t\xE2m c\xF3 s\xE2n bi\u1EBFt c\xF3 s\xE2n; t\xE2m t\xE1n lo\u1EA1n hay \u0111\u1ECBnh t\u0129nh \u0111\u1EC1u bi\u1EBFt r\xF5.","Qu\xE1n s\u1EF1 sinh kh\u1EDFi, qu\xE1n s\u1EF1 ho\u1EA1i di\u1EC7t; s\u1ED1ng kh\xF4ng n\u01B0\u01A1ng t\u1EF1a, kh\xF4ng ch\u1EA5p tr\u01B0\u1EDBc m\u1ED9t v\u1EADt g\xEC \u1EDF \u0111\u1EDDi."]},{id:"phap-cu",name:"Ph\xE1p C\xFA \xB7 Song Y\u1EBFu",pali:"Dhammapada, Yamakavagga",ref:"Ti\u1EC3u B\u1ED9, Dhp 1\u20135",key:"Manopubba\u1E45gam\u0101 dhamm\u0101 manose\u1E6D\u1E6Dh\u0101 manomay\u0101.",lines:["T\xE2m d\u1EABn \u0111\u1EA7u m\u1ECDi ph\xE1p; t\xE2m l\xE0m ch\u1EE7, t\xE2m t\u1EA1o t\xE1c.","N\xF3i hay l\xE0m v\u1EDBi t\xE2m \xF4 nhi\u1EC5m, kh\u1ED5 s\u1EBD theo sau, nh\u01B0 b\xE1nh xe l\u0103n theo ch\xE2n con v\u1EADt k\xE9o.","N\xF3i hay l\xE0m v\u1EDBi t\xE2m trong s\u1EA1ch, an vui s\u1EBD theo sau, nh\u01B0 b\xF3ng kh\xF4ng r\u1EDDi h\xECnh.","Ai c\u1EE9 \xF4m \xFD ngh\u0129: n\xF3 m\u1EAFng t\xF4i, \u0111\xE1nh t\xF4i, th\u1EAFng t\xF4i, l\u1EA5y c\u1EE7a t\xF4i; h\u1EADn th\xF9 trong ng\u01B0\u1EDDi \u1EA5y kh\xF4ng ngu\xF4i.","Ai kh\xF4ng \xF4m \xFD ngh\u0129 \u1EA5y, h\u1EADn th\xF9 t\u1EF1 l\u1EAFng.","\u1EDE \u0111\u1EDDi n\xE0y, h\u1EADn th\xF9 kh\xF4ng bao gi\u1EDD d\u1EE9t b\u1EB1ng h\u1EADn th\xF9; ch\u1EC9 d\u1EE9t b\u1EB1ng kh\xF4ng h\u1EADn. \u0110\xF3 l\xE0 \u0111\u1ECBnh lu\u1EADt ng\xE0n x\u01B0a."]}],om="Nguy\u1EC7n c\xF4ng \u0111\u1EE9c nghe Ph\xE1p n\xE0y lan \u0111\u1EBFn m\u1ECDi lo\xE0i: cho ai kh\u1ED5 \u0111\u01B0\u1EE3c h\u1EBFt kh\u1ED5, ai s\u1EE3 \u0111\u01B0\u1EE3c h\u1EBFt s\u1EE3, ai s\u1EA7u \u0111\u01B0\u1EE3c h\u1EBFt s\u1EA7u.
